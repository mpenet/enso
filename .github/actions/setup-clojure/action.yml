# ABOUTME: Composite action installing a Temurin JDK (25 unless asked otherwise) + the Clojure CLI and
# ABOUTME: restoring the Maven/gitlibs cache; shared by the test, nightly and release workflows.
name: Set up JDK and Clojure
description: Temurin JDK, Clojure CLI and dependency cache
inputs:
  java-version:
    description: Temurin JDK feature release
    default: '25'
runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
      with:
        cli: 1.12.5.1654

    - name: Cache Maven / Gitlibs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
        key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
        restore-keys: ${{ runner.os }}-clj-

    # tools.deps reads dependency descriptors on several threads, and the
    # Maven model validator it calls isn't thread-safe (intermittent
    # "HashMap$Node cannot be cast to HashMap$TreeNode"). Resolve every
    # classpath the workflows use once, serially; later runs read the
    # cached classpath and never resolve in parallel.
    - name: Resolve classpaths
      shell: bash
      run: |
        for aliases in -T:build -X:test -M:test-server -M:perf -M:perf-gate -A:fuzz -A:coverage; do
          clojure -Sthreads 1 -P "$aliases"
        done
