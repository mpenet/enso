name: release

# Multi-platform h3-native release build. Produces a single fat jar under
# ~/.m2 that bundles the JNI shim (libenso_quiche.<ext>) for all five
# supported (os, arch) pairs — libquiche 0.29.3 statically linked into
# each shim so the shipped jar has no runtime deps beyond a modern JDK.
# darwin-amd64 dropped (Intel Macs increasingly rare + macos-13 runner
# queue times); Intel Mac users can dev-build via `make -C native/enso_quiche`.
#
# Trigger:
#   - workflow_dispatch (manual button in the Actions tab)
#   - push of any tag matching v*
#
# Outputs (uploaded as workflow artifacts + published to Clojars on tag):
#   target/enso-<version>.jar            — core jar
#   target/enso-<version>-<classifier>.jar — per-platform native jars
#   target/enso-<version>-all.jar        — fat jar, all 5 platforms

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # Version pinned in the release CI so all platforms build against the
  # same libquiche revision. Bump in one place.
  QUICHE_VERSION: '0.29.3'

jobs:
  # ---------------------------------------------------------------------
  # One job per platform builds libquiche.a + statically-linked shim.
  # Each uploads its per-platform artifact; the merge job below assembles
  # the fat jar.
  # ---------------------------------------------------------------------
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            lib_ext: dylib
            runner: macos-14
          - os: linux
            arch: amd64
            lib_ext: so
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            lib_ext: so
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev llvm-dev \
            libfontconfig1-dev pkg-config

      - name: Cache libquiche build
        id: quiche-cache
        uses: actions/cache@v4
        with:
          # Whole checkout (not just target/release) so that the header
          # under quiche-src/quiche/include/quiche.h survives cache hits.
          # git clone is skipped when the cache resolves.
          path: quiche-src
          key: quiche-${{ env.QUICHE_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}-v2

      - name: Build libquiche ${{ env.QUICHE_VERSION }} (static)
        if: steps.quiche-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.QUICHE_VERSION }} \
            https://github.com/cloudflare/quiche.git quiche-src
          cd quiche-src
          cargo build --release --lib --features ffi,pkg-config-meta

      - name: Assemble libquiche staging dir
        run: |
          mkdir -p /tmp/quiche/lib /tmp/quiche/include
          cp quiche-src/target/release/libquiche.a /tmp/quiche/lib/
          cp quiche-src/quiche/include/quiche.h /tmp/quiche/include/

      - name: Build enso_quiche shim (static)
        run: |
          make -C native/enso_quiche \
            QUICHE_STATIC=1 \
            QUICHE_INCLUDE_DIR=/tmp/quiche/include \
            QUICHE_LIB_DIR=/tmp/quiche/lib
          ls -la target/native/${{ matrix.os }}-${{ matrix.arch }}/

      - name: Smoke-test the shim
        run: |
          file target/native/${{ matrix.os }}-${{ matrix.arch }}/libenso_quiche.${{ matrix.lib_ext }}
          # Verify no undefined external quiche symbols (static link done right).
          if [ "${{ matrix.os }}" = "linux" ]; then
            ! ldd target/native/${{ matrix.os }}-${{ matrix.arch }}/libenso_quiche.${{ matrix.lib_ext }} | grep -q libquiche
          else
            ! otool -L target/native/${{ matrix.os }}-${{ matrix.arch }}/libenso_quiche.${{ matrix.lib_ext }} | grep -q libquiche
          fi

      - name: Upload per-platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: libenso_quiche-${{ matrix.os }}-${{ matrix.arch }}
          path: target/native/${{ matrix.os }}-${{ matrix.arch }}/libenso_quiche.${{ matrix.lib_ext }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Alpine / musl builds. Runs on the host ubuntu runner (not inside a
  # `container:`) so all JS-based actions (checkout, cache,
  # upload-artifact) work on both amd64 and arm64 — JS Actions inside an
  # alpine container aren't supported on ARM runners. Actual build steps
  # shell into a docker container built from alpine:3.20 with the tools
  # baked in.
  # Loader classifier is `linux-musl-<arch>` (Quiche.java probes musl
  # first when /lib/ld-musl-*.so.1 is present, falls back to glibc).
  # ---------------------------------------------------------------------
  build-native-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache libquiche build
        id: quiche-cache
        uses: actions/cache@v4
        with:
          # Whole checkout (not just target/release) so that the header
          # under quiche-src/quiche/include/quiche.h survives cache hits.
          # git clone is skipped inside the container when the cache
          # resolves.
          path: quiche-src
          key: quiche-${{ env.QUICHE_VERSION }}-linux-musl-${{ matrix.arch }}-v2

      # openjdk21 is enough: we only need jni.h from JAVA_HOME/include
      # (ABI stable across JDK versions; the runtime jar loads on any 21+).
      # openjdk25 isn't in Alpine 3.20 repos.
      - name: Build libquiche + enso_quiche shim (static, inside alpine)
        env:
          QUICHE_VERSION: ${{ env.QUICHE_VERSION }}
          ARCH: ${{ matrix.arch }}
          CACHE_HIT: ${{ steps.quiche-cache.outputs.cache-hit }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e QUICHE_VERSION -e ARCH -e CACHE_HIT \
            alpine:3.20 sh -eu -c '
              apk add --no-cache \
                bash build-base cmake clang clang-dev llvm-dev \
                perl python3 pkgconf openjdk21 curl git \
                linux-headers openssl-dev fontconfig-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
              export PATH="$HOME/.cargo/bin:$PATH"
              export JAVA_HOME=/usr/lib/jvm/default-jvm

              # bindgen (used transitively by boring-sys) dlopens libclang.
              # Musl-static rust binaries return "Dynamic loading not
              # supported" from dlopen — force cargo to link build scripts
              # + the final artifact dynamically against musl libc.so.
              # LIBCLANG_PATH points bindgen at the apk-installed libclang.
              export RUSTFLAGS="-C target-feature=-crt-static"
              export LIBCLANG_PATH=/usr/lib/llvm17/lib

              if [ "$CACHE_HIT" != "true" ]; then
                rm -rf quiche-src
                git clone --depth 1 --branch "$QUICHE_VERSION" \
                  https://github.com/cloudflare/quiche.git quiche-src
                # -p quiche restricts to the quiche crate only. Full
                # workspace build pulls in `datagram-socket`, which
                # constructs libc::msghdr via struct-literal syntax —
                # broken on musl where libc exposes private __pad
                # fields not present in the glibc layout. quiche itself
                # does not need datagram-socket for libquiche.a.
                (cd quiche-src && cargo build --release -p quiche \
                  --features ffi,pkg-config-meta)
              fi

              mkdir -p /tmp/quiche/lib /tmp/quiche/include
              cp quiche-src/target/release/libquiche.a /tmp/quiche/lib/
              cp quiche-src/quiche/include/quiche.h /tmp/quiche/include/

              make -C native/enso_quiche \
                QUICHE_STATIC=1 \
                QUICHE_INCLUDE_DIR=/tmp/quiche/include \
                QUICHE_LIB_DIR=/tmp/quiche/lib

              # Rename to the musl classifier and smoke-test.
              mv target/native/linux-$ARCH target/native/linux-musl-$ARCH
              file target/native/linux-musl-$ARCH/libenso_quiche.so
              if ldd target/native/linux-musl-$ARCH/libenso_quiche.so 2>&1 | grep -q libquiche; then
                echo "ERROR: dynamic libquiche dep leaked" >&2
                exit 1
              fi
            '

      - name: Upload per-platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: libenso_quiche-linux-musl-${{ matrix.arch }}
          path: target/native/linux-musl-${{ matrix.arch }}/libenso_quiche.so
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Assemble the fat jar with all 5 platform shims inside.
  # ---------------------------------------------------------------------
  package:
    needs: [build-native, build-native-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1654

      - name: Cache Maven / Gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Download all platform shims
        uses: actions/download-artifact@v4
        with:
          path: /tmp/native-artifacts
          pattern: libenso_quiche-*

      - name: Stage shims into target/native/<os>-<arch>/
        run: |
          for d in /tmp/native-artifacts/libenso_quiche-*; do
            name=$(basename "$d")           # e.g. libenso_quiche-darwin-arm64
            classifier=${name#libenso_quiche-}   # → darwin-arm64
            mkdir -p target/native/$classifier
            cp $d/libenso_quiche.* target/native/$classifier/
          done
          find target/native -type f

      - name: Build core jar (no native)
        run: clojure -T:build jar-core

      - name: Build per-classifier native jars
        run: |
          for d in target/native/*/; do
            classifier=$(basename "$d")
            clojure -T:build jar-classifier :classifier "\"$classifier\""
          done

      - name: Build fat jar (all platforms bundled)
        run: clojure -T:build jar-all

      - name: Verify jar contents
        run: |
          for j in target/enso-*.jar; do
            echo "== $(basename $j) ($(du -h $j | cut -f1)) =="
            jar tf "$j" | grep -E '^META-INF/native/' | sort || echo "  (no native)"
          done

      - name: Upload jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enso-jars
          path: target/enso-*.jar
          if-no-files-found: error

      # Publishes core + every per-classifier + fat jar to Clojars.
      # Users declare `com.s-exp/enso` (core), `com.s-exp/enso$<os>-<arch>`
      # per platform, or `com.s-exp/enso$all` for the fat jar in their
      # deps.edn. Guarded on tag push so workflow_dispatch runs don't
      # attempt re-publishes.
      - name: Configure Clojars credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>clojars</id>
                <username>${CLOJARS_USERNAME}</username>
                <password>${CLOJARS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish all jars to Clojars
        if: startsWith(github.ref, 'refs/tags/v')
        run: clojure -T:build deploy-jars
