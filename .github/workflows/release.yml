# ABOUTME: Release pipeline: gating tests, the five static JNI shims (checked and load-tested), an HTTP/3
# ABOUTME: smoke test on macOS, then the core + per-platform classifier jars published to Clojars.
name: release

# Shims: darwin-arm64 (built on macOS, minimum macOS from
# native/enso_quiche/pins.env), linux-amd64 / linux-arm64 (built in
# AlmaLinux 8: glibc 2.28 baseline) and linux-musl-amd64 /
# linux-musl-arm64 (built in Alpine). Each statically links libquiche and
# BoringSSL, so the jars need nothing beyond a JDK 21+. Every shim goes
# through native/enso_quiche/check-shim.sh (exports, hardening, glibc /
# macOS ceilings, a JVM load through the jar layout) where it was built.
# Intel Macs are not shipped: they build the shim locally (doc/http3.md).
#
# Trigger: push of a v* tag (publishes), or workflow_dispatch (builds and
# uploads the jars as run artifacts, publishes nothing).
#
# Outputs:
#   target/enso-<version>.jar              core jar (Clojars + run artifact)
#   target/enso-<version>-<classifier>.jar per-platform native jars (Clojars + run artifact)
#   target/enso-<version>-all.jar          core + every shim, run artifact only: it
#                                          exceeds the Clojars per-file size limit

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full test + conformance workflow; nothing is built or published
  # unless it passes.
  test:
    uses: ./.github/workflows/test.yml

  build-darwin:
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Build enso_quiche shim (static)
        uses: ./.github/actions/build-shim

      - name: Check and load-test the shim
        run: |
          set -a; . native/enso_quiche/pins.env; set +a
          native/enso_quiche/check-shim.sh target/native/darwin-arm64/libenso_quiche.dylib darwin-arm64

      - name: Upload per-platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libenso_quiche-darwin-arm64
          path: target/native/darwin-arm64/libenso_quiche.dylib
          if-no-files-found: error
          retention-days: 7

  # Built inside the baseline containers through `docker run` from the
  # host, so the JavaScript actions (checkout, cache, upload-artifact)
  # run on the runner on both amd64 and arm64.
  build-linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {libc: gnu, arch: amd64, runner: ubuntu-24.04, classifier: linux-amd64,
             image: 'almalinux:8.10@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe'}
          - {libc: gnu, arch: arm64, runner: ubuntu-24.04-arm, classifier: linux-arm64,
             image: 'almalinux:8.10@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe'}
          - {libc: musl, arch: amd64, runner: ubuntu-24.04, classifier: linux-musl-amd64,
             image: 'alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'}
          - {libc: musl, arch: arm64, runner: ubuntu-24.04-arm, classifier: linux-musl-arm64,
             image: 'alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'}
    runs-on: ${{ matrix.runner }}
    # libquiche + BoringSSL take 5-10 minutes natively; the limit keeps a
    # hung linker from holding the runner for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read native pins
        id: pins
        run: grep -E '^[A-Z_]+=' native/enso_quiche/pins.env >> "$GITHUB_OUTPUT"

      - name: Cache libquiche build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quiche-src
          key: quiche-${{ steps.pins.outputs.QUICHE_COMMIT }}-${{ hashFiles('native/enso_quiche/quiche-Cargo.lock', 'native/enso_quiche/patches/*.patch') }}-${{ steps.pins.outputs.RUST_TOOLCHAIN }}-linux-${{ matrix.libc }}-${{ matrix.arch }}

      - name: Build, check and load-test the shim (${{ matrix.image }})
        env:
          IMAGE: ${{ matrix.image }}
          LIBC: ${{ matrix.libc }}
        run: docker run --rm -v "$PWD":/work -w /work "$IMAGE" sh native/enso_quiche/build-linux.sh "$LIBC"

      - name: Upload per-platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libenso_quiche-${{ matrix.classifier }}
          path: target/native/${{ matrix.classifier }}/libenso_quiche.so
          if-no-files-found: error
          retention-days: 7

  # macOS is where native memory corruption has shown up before: run the
  # HTTP/3 end-to-end namespaces against the exact shim being shipped.
  smoke-darwin-h3:
    needs: build-darwin
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clojure

      - name: Download the darwin-arm64 shim
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libenso_quiche-darwin-arm64
          path: target/native/darwin-arm64

      - name: Compile Java sources
        run: clojure -T:build javac

      - name: HTTP/3 end-to-end against the release shim
        run: script/test.sh s-exp.quiche-h3-foundation-test s-exp.enso-h3-e2e-test

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-darwin-h3-logs
          path: target/test-logs/
          retention-days: 7

  package:
    needs: [build-darwin, build-linux, smoke-darwin-h3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ENSO_VERSION is picked up by build.clj and overrides the local
      # git-count-based version: tag `v1.0.0-alphaN` publishes
      # `1.0.0-alphaN`. workflow_dispatch runs keep the git-count version.
      - name: Derive ENSO_VERSION from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "ENSO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-clojure

      - name: Download all platform shims
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/native-artifacts
          pattern: libenso_quiche-*

      - name: Stage shims into target/native/<classifier>/
        run: |
          for d in /tmp/native-artifacts/libenso_quiche-*; do
            classifier="${d##*/libenso_quiche-}"
            mkdir -p "target/native/$classifier"
            cp "$d"/libenso_quiche.* "target/native/$classifier/"
          done
          find target/native -type f

      - name: Build core jar (no native)
        run: clojure -T:build jar-core

      - name: Build per-classifier native jars
        run: |
          for d in target/native/*/; do
            classifier=$(basename "$d")
            clojure -T:build jar-classifier :classifier "\"$classifier\""
          done

      - name: Build all-platform jar (run artifact only)
        run: clojure -T:build jar-all

      - name: Verify jar contents
        run: |
          for j in target/enso-*.jar; do
            echo "== $(basename "$j") ($(du -h "$j" | cut -f1)) =="
            jar tf "$j" | grep -E '^META-INF/(native/|NOTICE|THIRD-PARTY-NOTICES|LICENSE)' | sort
            for f in LICENSE NOTICE THIRD-PARTY-NOTICES; do
              jar tf "$j" | grep -qx "META-INF/$f" || { echo "missing META-INF/$f in $j" >&2; exit 1; }
            done
          done
          for c in darwin-arm64 linux-amd64 linux-arm64 linux-musl-amd64 linux-musl-arm64; do
            jar tf target/enso-*-"$c".jar | grep -q "^META-INF/native/$c/libenso_quiche\." \
              || { echo "missing shim jar for $c" >&2; exit 1; }
          done

      - name: Upload jar artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enso-jars
          path: target/enso-*.jar
          if-no-files-found: error

      # Publishes core + every per-classifier jar to Clojars. Users declare
      # `com.s-exp/enso` (core) plus `com.s-exp/enso$<classifier>` for each
      # platform they run on. Guarded on tag push so workflow_dispatch runs
      # never publish.
      - name: Configure Clojars credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          umask 077
          python3 - > ~/.m2/settings.xml <<'EOF'
          import os
          from xml.sax.saxutils import escape
          print(f"""<settings>
            <servers>
              <server>
                <id>clojars</id>
                <username>{escape(os.environ["CLOJARS_USERNAME"])}</username>
                <password>{escape(os.environ["CLOJARS_PASSWORD"])}</password>
              </server>
            </servers>
          </settings>""")
          EOF

      - name: Publish core + classifier jars to Clojars
        if: startsWith(github.ref, 'refs/tags/v')
        run: clojure -T:build deploy-jars
